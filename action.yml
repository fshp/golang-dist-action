name: Create and publish a golang vendor tarball
author: Arthur Zamarin
description: Create a Gentoo golang vendor tarball and attach it to a release
inputs:
  tag:
    description: Tag to create release on
    default: ${{ github.ref_name }}
  workdir:
    description: Directory containing the go.mod file (relative to repository root)
    default: .
  exclude-directories:
    description: Space separated list of directories that contain a go.mod file to ignore
  vendor-dir:
    description: Top level dir name inside source archive
  dist-filename:
    description: The name of distribution file (e.g. foo-1.2.3-deps.tar.xz)
    default: ${{ github.event.repository.name }}-${{ github.ref_name }}
runs:
  using: composite
  steps:
    - name: Checkout
      uses: actions/checkout@v4

    - uses: actions/setup-go@v6
      with:
        go-version: "1.26.5"
        check-latest: true

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "24"

    - name: Collect pnpm
      shell: bash
      env:
        PNPM_HOME: "/tmp/pnpm"
      run: |
        corepack enable
        echo "::group::Running pnpm install"
        pnpm install --frozen-lockfile || exit 1
        echo "::endgroup::"

    - name: Collect go-mod
      shell: bash
      working-directory: ${{ inputs.workdir }}
      env:
        GOMODCACHE: "/tmp/go-mod"
      run: |
        find . -iname 'go.mod' -type f -exec dirname {} \; | while read GOMOD_DIR; do
          exclude=0
          for d in ${{ inputs.exclude-directories }}; do
            if [[ "${GOMOD_DIR#./}" == "${d#./}" ]]; then
              exclude=1
              break
            fi
          done
          if [ "$exclude" -ne 0 ]; then
            continue
          fi
          echo "::group::Processing ${GOMOD_DIR}/go.mod"
          pushd "${GOMOD_DIR}" >&/dev/null || exit 1
          go mod download -x -modcacherw || exit 1
          popd >&/dev/null || exit 1
          echo "::endgroup::"
        done

    - name: Collect vendor
      shell: bash
      working-directory: ${{ inputs.workdir }}
      run: |
        if [[ -e go.work ]]; then
          echo "::group::Running go work vendor"
          go work vendor
          echo "::endgroup::"
        else
          echo "::group::Running go mod vendor"
          go mod vendor
          echo "::endgroup::"
        fi

    - name: Create a deps tarball
      shell: bash
      working-directory: ${{ inputs.workdir }}
      env:
        XZ_OPT: "-T0 -9e"
      run: |
        echo "::group::Creating dist tarball ${{ inputs.dist-filename }}-deps.tar.xz"
        find "/tmp/go-mod/cache/download" -type f -name '*.zip' -delete || exit 1
        LC_ALL=C TZ=UTC tar -C /tmp \
          --mtime="${SOURCE_DATE_EPOCH:-1970-01-01}" --sort=name --owner=250 --group=250 \
          -acf "${{ inputs.dist-filename }}-deps.tar.xz" go-mod || exit 1
        echo "::endgroup::"

    - name: Create a vendor tarball
      shell: bash
      working-directory: ${{ inputs.workdir }}
      env:
        XZ_OPT: "-T0 -9e"
      run: |
        echo "::group::Creating dist tarball ${{ inputs.dist-filename }}-vendor.tar.xz"
        LC_ALL=C TZ=UTC tar \
          --mtime="${SOURCE_DATE_EPOCH:-1970-01-01}" --sort=name --owner=250 --group=250 \
          --transform 's,^,${{ inputs.vendor-dir }}/,' -acf "${{ inputs.dist-filename }}-vendor.tar.xz" vendor || exit 1
        echo "::endgroup::"

    - name: Create pnpm tarball
      shell: bash
      env:
        XZ_OPT: "-T0 -9e"
      run: |
        echo "::group::Creating dist tarball ${{ inputs.dist-filename }}-pnpm.tar.xz"
        LC_ALL=C TZ=UTC tar -C /tmp \
          --mtime="${SOURCE_DATE_EPOCH:-1970-01-01}" --sort=name --owner=250 --group=250 \
          -acf "${{ inputs.dist-filename }}-pnpm.tar.xz" pnpm/store || exit 1
        echo "::endgroup::"

    - name: Create release
      uses: softprops/action-gh-release@v2
      with:
        body:
        files: |
          ${{ inputs.workdir }}/${{ inputs.dist-filename }}-deps.tar.xz
          ${{ inputs.workdir }}/${{ inputs.dist-filename }}-vendor.tar.xz
          ${{ inputs.dist-filename }}-pnpm.tar.xz
        tag_name: ${{ inputs.tag }}
        fail_on_unmatched_files: true
